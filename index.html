<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Farming Simulator Mods</title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
      <link rel="stylesheet" href="styles.css">
      <script>
         window.onload = function() {
             const descripciones = document.querySelectorAll('.descripcion-mod');
             descripciones.forEach(descripcion => {
                 descripcion.textContent = descripcion.getAttribute('data-es');
             });
         }
      </script>
   </head>
   <body class="bg-gray-100">

      <!-- TODO EL CONTENIDO DE TU WEB SE MANTIENE IGUAL -->

<footer class="bg-custom text-white p-4 text-center mt-12">
  <a id="btn-play"
     href="intent://details?id=com.tu.paquete.de.app#Intent;scheme=market;end"
     class="inline-block px-6 py-3 bg-purple-600 rounded-lg text-white font-semibold shadow-lg hover:bg-purple-700 transition">
    Abrir mi App en Google Play
  </a>
</footer>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const isAndroid = /Android/i.test(navigator.userAgent);
    if (!isAndroid) {
      document.getElementById("btn-play").style.display = "none";
    }
  });
</script>

   </body>
</html>
